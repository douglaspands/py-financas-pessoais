[project]
name = "py-financas-pessoais"
version = "0.1.0"
description = "A personal finance management application built with FastAPI and SQLModel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.3",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.29",
    "sqlmodel>=0.0.38",
    "typer>=0.26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "ty>=0.0.40",
]
